name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  # ------------------------------------------------------------------
  # Headless physics tests (N-body integrator, collisions, save/load)
  # ------------------------------------------------------------------
  sim-tests:
    name: Simulation tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build test_sim
        run: |
          g++ -std=c++11 -Wall -Wextra -O2 -Isrc \
            tests/test_sim.cpp \
            src/core/system.cpp src/core/presets.cpp src/core/savestate.cpp \
            -o test_sim
      - name: Run test_sim
        run: ./test_sim

  # ------------------------------------------------------------------
  # Compile-check the Windows-only layer against stub Win32 headers
  # ------------------------------------------------------------------
  win32-stub-check:
    name: Windows layer compile-check (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile-check Win32 code
        run: sh tools/compile-check/check.sh

  # ------------------------------------------------------------------
  # Real Windows build with MSVC (any recent Visual Studio with the
  # C++ x64 toolset - located via vswhere, driven by the Ninja
  # generator, so no specific VS generator is required)
  # ------------------------------------------------------------------
  windows-msvc:
    name: Build x64 (MSVC, Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure CMake
        shell: pwsh
        run: |
          if (Get-Command cmake -ErrorAction SilentlyContinue) {
            cmake --version
          } else {
            Write-Host "CMake not on PATH; installing via winget"
            winget install --id Kitware.CMake -e --accept-source-agreements --accept-package-agreements
            $bin = "C:\Program Files\CMake\bin"
            if (Test-Path $bin) {
              Add-Content -Path $env:GITHUB_PATH -Value $bin
              $env:Path += ";$bin"
            }
            cmake --version
          }
      - name: Locate Visual Studio C++ tools
        id: vs
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            Write-Host "ERROR: vswhere not found at $vswhere"
            exit 1
          }
          $path = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if ([string]::IsNullOrWhiteSpace($path)) {
            Write-Host "ERROR: no Visual Studio installation with the C++ x64 toolset"
            exit 1
          }
          Write-Host "Using Visual Studio at: $path"
          "vsPath=$path" | Add-Content $env:GITHUB_OUTPUT
      - name: Configure
        shell: pwsh
        env:
          VSPATH: ${{ steps.vs.outputs.vsPath }}
        run: |
          $out = & cmd /c "`"%VSPATH%\VC\Auxiliary\Build\vcvars64.bat`" && cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release 2>&1"
          $out | ForEach-Object { Write-Host $_ }
          if ($LASTEXITCODE -ne 0) {
            $out | Where-Object { $_ -match "error|FAILED" } | Select-Object -First 25 | ForEach-Object { Write-Host "::error title=MSVC-configure-failure::$_" }
            $out | Select-Object -Last 10 | ForEach-Object { Write-Host "::error title=MSVC-configure-tail::$_" }
            exit 1
          }
      - name: Build (Release)
        shell: pwsh
        env:
          VSPATH: ${{ steps.vs.outputs.vsPath }}
        run: |
          $out = & cmd /c "`"%VSPATH%\VC\Auxiliary\Build\vcvars64.bat`" && cmake --build build --parallel 2>&1"
          $out | ForEach-Object { Write-Host $_ }
          if ($LASTEXITCODE -ne 0) {
            $out | Where-Object { $_ -match "error|FAILED" } | Select-Object -First 25 | ForEach-Object { Write-Host "::error title=MSVC-build-failure::$_" }
            $out | Select-Object -Last 10 | ForEach-Object { Write-Host "::error title=MSVC-build-tail::$_" }
            exit 1
          }
      - name: Stage software-rendering fallback launcher
        shell: pwsh
        run: |
          Copy-Item tools\run_mesa.bat build\run_mesa.bat
          Get-Item build\run_mesa.bat | Format-List Name,Length
      - name: Verify exe
        shell: pwsh
        run: |
          if (-not (Test-Path build\us3d.exe)) { throw "us3d.exe not found" }
          Get-Item build\us3d.exe | Format-List Name,Length
      - name: Create NSIS installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $log = 'nsis-diag.log'
          $diag = New-Object System.Collections.Generic.List[string]
          function Log($t) { Write-Host $t; Add-Content -Path $log -Value $t }
          function Diag($t) { $diag.Add($t) }
          try {
            $makensis = $null
            $cmd = Get-Command makensis -ErrorAction SilentlyContinue
            if ($cmd) { $makensis = $cmd.Source }
            if (-not $makensis -and (Test-Path "C:\Program Files (x86)\NSIS\makensis.exe")) { $makensis = "C:\Program Files (x86)\NSIS\makensis.exe" }
            if ($makensis) { Diag "found=$makensis" }
            if (-not $makensis) {
              Log "NSIS not preinstalled; trying install options"
              # 1) choco (proven present on the current windows image)
              if (Get-Command choco -ErrorAction SilentlyContinue) {
                $chocoOut = & choco install nsis -y --no-progress --force 2>&1
                $chocoOut | ForEach-Object { Log $_ }
                Diag "choco_exit=$LASTEXITCODE out=$(($chocoOut | Where-Object { $_ -match '^\s*\[|installed|error|warn' } | Select-Object -Last 4) -join ' / ')"
                if ($LASTEXITCODE -eq 0) {
                  # The choco package runs NSIS's own installer -> Program Files (x86)\NSIS
                  if (Test-Path "C:\Program Files (x86)\NSIS\makensis.exe") { $makensis = "C:\Program Files (x86)\NSIS\makensis.exe" }
                  if (-not $makensis) {
                    $c2 = Get-Command makensis -ErrorAction SilentlyContinue
                    if ($c2) { $makensis = $c2.Source }
                  }
                  if (-not $makensis -and (Test-Path "C:\ProgramData\chocolatey\bin\makensis.exe")) { $makensis = "C:\ProgramData\chocolatey\bin\makensis.exe" }
                  if (-not $makensis) {
                    $f = Get-ChildItem -Path "C:\ProgramData\chocolatey\lib\nsis" -Recurse -Filter makensis.exe -ErrorAction SilentlyContinue | Select-Object -First 1
                    if ($f) { $makensis = $f.FullName }
                  }
                }
              } else { Diag "choco=missing" }
              # 2) winget
              if (-not $makensis -and (Get-Command winget -ErrorAction SilentlyContinue)) {
                $wout = & winget search NSIS --accept-source-agreements 2>&1
                $wout | ForEach-Object { Log $_ }
                $wids = $wout | ForEach-Object { ($_ -split '\s+') } |
                        Where-Object { $_.Count -ge 2 -and $_ -contains 'NSIS' } |
                        ForEach-Object { $_[0] } |
                        Where-Object { $_ -ne 'Id' -and $_ -notmatch '[█▒]' } |
                        Sort-Object -Unique
                Diag "winget_search_ids=$($wids -join ';')"
                if ($wids) {
                  $winst = & winget install --id $wids[0] -e --silent --accept-source-agreements --accept-package-agreements 2>&1
                  $winst | ForEach-Object { Log $_ }
                  Diag "winget_install_exit=$LASTEXITCODE"
                  $cands = @()
                  if (Test-Path "C:\Program Files (x86)\NSIS\makensis.exe") { $cands += "C:\Program Files (x86)\NSIS\makensis.exe" }
                  if (Test-Path "C:\Program Files\NSIS\makensis.exe") { $cands += "C:\Program Files\NSIS\makensis.exe" }
                  $f = Get-ChildItem -Path "$env:LOCALAPPDATA\Microsoft\WinGet" -Recurse -Filter makensis.exe -ErrorAction SilentlyContinue | Select-Object -First 1
                  if ($f) { $cands += $f.FullName }
                  if ($cands) { $makensis = $cands[0] }
                }
              }
              # 3) direct download (URLs discovered at run time)
              if (-not $makensis) {
                if (-not (Get-Command curl.exe -ErrorAction SilentlyContinue)) { Diag "curl=missing"; }
                else {
                  $urls = @()
                  # 3a) the choco nupkg itself (choco CDN; a zip with tools\makensis.exe)
                  try {
                    curl.exe -fsSL --retry 2 -o nsis_feed.xml "https://community.chocolatey.org/api/v2/FindPackagesById()?id='nsis'"
                    $m = [regex]::Match((Get-Content nsis_feed.xml -Raw), 'd:downloadUri="([^"]+\.nupkg)"')
                    if ($m.Success) {
                      Log "nupkg: $($m.Groups[1].Value)"
                      curl.exe -fsSL --retry 2 -o nsis.nupkg $m.Groups[1].Value
                      if ($LASTEXITCODE -eq 0) {
                        Expand-Archive -Path nsis.nupkg -DestinationPath nupkg -Force
                        $f = Get-ChildItem -Path nupkg -Recurse -Filter makensis.exe -ErrorAction SilentlyContinue | Select-Object -First 1
                        if ($f) { $makensis = $f.FullName }
                        Diag "nupkg=ok makensis=$([bool]$f)"
                      } else { Diag "nupkg=curl$LASTEXITCODE" }
                    } else { Diag "nupkg=no-url" }
                  } catch { Diag "nupkg=error" }
                  # 3b) nuspec packageSourceUrl
                  if (-not $makensis) {
                  try {
                    curl.exe -fsSL --retry 2 -o nsis.nuspec "https://community.chocolatey.org/api/v2/package/nsis"
                    [xml]$nuspec = Get-Content nsis.nuspec -Raw
                    $ver = $nuspec.package.version; $src = $nuspec.package.packageSourceUrl
                    if ($src -and $ver) { $urls += ($src -replace '\{0\}', $ver); Diag "nuspec=$ver" }
                    else { Diag "nuspec=no-url" }
                  } catch { Diag "nuspec=error" }
                  }
                  try {
                    curl.exe -fsSL --retry 2 -o nsis_files.html "https://sourceforge.net/projects/nsis/files/NSIS%20Zip/"
                    $links = [regex]::Matches((Get-Content nsis_files.html -Raw), '/projects/nsis/files/NSIS%20Zip/([\d.]+)/([^"/]+\.zip)/download')
                    $urls += ($links | ForEach-Object { 'https://sourceforge.net' + $_.Value } | Sort-Object -Unique)
                    Diag "sf_candidates=$($links.Count)"
                  } catch { Diag "sf=error" }
                  foreach ($u in $urls) {
                    Log "Trying $u"
                    curl.exe -fsSL --retry 2 -o nsis.zip $u
                    if ($LASTEXITCODE -eq 0) {
                      Expand-Archive -Path nsis.zip -DestinationPath nsispkg -Force
                      $found = Get-ChildItem -Path nsispkg -Recurse -Filter makensis.exe | Select-Object -First 1
                      if ($found) { $makensis = $found.FullName }
                      break
                    } else { Diag "curl_fail=$LASTEXITCODE" }
                  }
                }
              }
              if (-not $makensis) {
                Write-Host "::error title=NSIS-diag::$($diag -join ' | ')"
                exit 1
              }
            }
            Log "Using makensis: $makensis"
            $out = & $makensis -V2 tools\installer\setup.nsi 2>&1
            $out | ForEach-Object { Log $_ }
            if ($LASTEXITCODE -ne 0) {
              $tail = (($out | Select-Object -Last 8) -join ' / ')
              Write-Host "::error title=NSIS-diag::build-failed | $($diag -join ' | ') | $tail"
              exit 1
            }
            if (-not (Test-Path "tools\installer\UniverseSandbox3D-Setup-1.0.0-win64.exe")) { throw "installer was not produced" }
            Get-Item "tools\installer\UniverseSandbox3D-Setup-1.0.0-win64.exe" | Format-List Name,Length
          } catch {
            Write-Host "::error title=NSIS-diag::unhandled=$_ | $($diag -join ' | ')"
            exit 1
          }
      - name: Verify PE headers (Windows 7 / 10 / 11 compatibility proof)
        shell: pwsh
        run: |
          function Get-PeInfo([string]$Path) {
            $b = [System.IO.File]::ReadAllBytes($Path)
            $pe = [BitConverter]::ToInt32($b, 0x3C)
            $machine = [BitConverter]::ToUInt16($b, $pe+4)
            $magic = [BitConverter]::ToUInt16($b, $pe+24)
            $pe32plus = ($magic -eq 0x20B)
            $osMaj = $b[$pe+64]; $osMin = $b[$pe+65]
            $svMaj = $b[$pe+72]; $svMin = $b[$pe+73]
            $subsysOff = if ($pe32plus) { $pe+92 } else { $pe+88 }
            $subsys = [BitConverter]::ToUInt16($b, $subsysOff)
            $line = '{0}: machine=0x{1:x4} PE32+={2} minOS={3}.{4} subsystemVersion={5}.{6} subsystem={7}' -f (Split-Path $Path -Leaf), $machine, $pe32plus, $osMaj, $osMin, $svMaj, $svMin, $subsys
            Write-Host $line
            Add-Content -Path "nsis-diag.log" -Value $line -ErrorAction SilentlyContinue
            $win7ok = ($osMaj -lt 6) -or (($osMaj -eq 6) -and ($osMin -le 1))
            return @($line, $win7ok)
          }
          $all = @()
          foreach ($p in @("build\us3d.exe", "tools\installer\UniverseSandbox3D-Setup-1.0.0-win64.exe")) {
            $all += Get-PeInfo $p
          }
          # Hard gate: a PE that declares a minimum OS newer than 6.1
          # would be refused by the Windows 7 loader.
          $bad = @()
          if (-not $all[1]) { $bad += "us3d.exe" }
          if (-not $all[3]) { $bad += "installer" }
          if ($bad.Count -gt 0) {
            Write-Host ("::error title=PE-Win7-incompatible::minOS > 6.1 in: {0} - the Win7 loader will refuse the image" -f ($bad -join ', '))
            exit 1
          }
          Write-Host ("::warning title=PE-verify-win7-ok::{0}" -f (($all | Where-Object { $_ -is [string] }) -join ' | '))
      - name: Upload NSIS diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: UniverseSandbox3D-nsis-diag
          path: nsis-diag.log
          if-no-files-found: ignore
      - name: Upload installer and exe
        uses: actions/upload-artifact@v4
        with:
          name: UniverseSandbox3D-Setup-win64
          path: |
            tools/installer/UniverseSandbox3D-Setup-1.0.0-win64.exe
            build/us3d.exe
            build/run_mesa.bat
      - name: Upload MSVC-built exe (standalone)
        uses: actions/upload-artifact@v4
        with:
          name: UniverseSandbox3D-exe-msvc-win64
          path: |
            build/us3d.exe
            build/run_mesa.bat

  # ------------------------------------------------------------------
  # Real Windows build with a MinGW-w64 cross compiler.
  # NOTE: the "MinGW Makefiles" CMake generator only exists on Windows
  # hosts, so on Linux we cross-compile with the plain Makefiles
  # generator + CMAKE_SYSTEM_NAME=Windows.
  # Compiler preference:
  #   1. x86_64-w64-mingw32-g++ when preinstalled,
  #   2. otherwise zig (pypi 'ziglang') targeting x86_64-windows-gnu,
  #      which bundles the mingw-w64 CRT and needs no system packages
  #      (apt on shared runners is unreliable and sometimes hangs).
  # ------------------------------------------------------------------
  windows-cross:
    name: Build x64 (MinGW-w64 cross)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show CMake version
        run: cmake --version
      - name: Ensure Windows cross compiler
        id: toolchain
        run: |
          set -e
          if command -v x86_64-w64-mingw32-g++ >/dev/null 2>&1; then
            echo "Using preinstalled MinGW-w64"
            x86_64-w64-mingw32-g++ --version | head -1
            echo "kind=mingw" >> "$GITHUB_OUTPUT"
          else
            # The pypi 'ziglang' wheel is a plain zip that bundles the zig
            # binary (with its mingw-w64 CRT) - no python, pip or apt needed.
            echo "MinGW-w64 not preinstalled; downloading zig 0.17.0 wheel"
            curl -fsSL --retry 3 -o ziglang.whl \
              "https://files.pythonhosted.org/packages/fe/6f/e1c380fe61db36cb464d5d4d18c557338812500986885373e2550d4ebf6b/ziglang-0.17.0-py3-none-manylinux_2_12_x86_64.manylinux2010_x86_64.musllinux_1_1_x86_64.whl"
            unzip -q ziglang.whl -d zigpkgs
            ZIG="$PWD/zigpkgs/ziglang/zig"
            "$ZIG" version   # first run self-extracts the toolchain
            printf '#!/bin/sh\nexec %s cc "$@"\n'  "$ZIG" > zigcc
            printf '#!/bin/sh\nexec %s c++ "$@"\n' "$ZIG" > zigcxx
            chmod +x zigcc zigcxx
            echo "kind=zig" >> "$GITHUB_OUTPUT"
          fi
      - name: Configure
        run: |
          if [ "${{ steps.toolchain.outputs.kind }}" = "zig" ]; then
            cmake -B build \
              -DCMAKE_SYSTEM_NAME=Windows \
              -DCMAKE_SYSTEM_PROCESSOR=x86_64 \
              -DCMAKE_C_COMPILER=$PWD/zigcc \
              -DCMAKE_CXX_COMPILER=$PWD/zigcxx \
              -DCMAKE_C_FLAGS="-target x86_64-windows-gnu" \
              -DCMAKE_CXX_FLAGS="-target x86_64-windows-gnu"
          else
            cmake -B build \
              -DCMAKE_SYSTEM_NAME=Windows \
              -DCMAKE_SYSTEM_PROCESSOR=x86_64 \
              -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc \
              -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++
          fi
      - name: Build
        run: |
          cmake --build build --parallel 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -nE "error:|Error [0-9]|undefined reference|collect2|ld returned|FAILED" build.log | head -25 | while IFS= read -r line; do
              printf '::error title=Cross-build-failure::%s\n' "$line"
            done
            tail -n 10 build.log | while IFS= read -r line; do
              printf '::error title=Cross-build-tail::%s\n' "$line"
            done
            exit "$status"
          fi
      - name: Verify exe
        run: |
          file build/us3d.exe || true
          test -f build/us3d.exe
          # PE header proof: x64 GUI exe with a minimum OS the Win7
          # loader (6.1) will accept.
          dump_pe() {
            f=$1
            pe=$(od -An -t u4 -j 60 -N 4 "$f" | tr -d ' ')
            u16() { # $1 = offset; file from $f
              lo=$(od -An -t u1 -j "$1" -N 1 "$f" | tr -d ' ')
              hi=$(od -An -t u1 -j $(( $1 + 1 )) -N 1 "$f" | tr -d ' ')
              echo $(( lo + hi * 256 ))
            }
            machine=$(u16 $((pe+4)))
            magic=$(u16 $((pe+24)))
            osmaj=$(od -An -t u1 -j $((pe+64)) -N 1 "$f" | tr -d ' ')
            osmin=$(od -An -t u1 -j $((pe+65)) -N 1 "$f" | tr -d ' ')
            svmaj=$(od -An -t u1 -j $((pe+72)) -N 1 "$f" | tr -d ' ')
            svmin=$(od -An -t u1 -j $((pe+73)) -N 1 "$f" | tr -d ' ')
            if [ "$magic" -eq 523 ]; then plus=yes; else plus=no; fi
            printf '%s: machine=%s PE32+=%s minOS=%s.%s subsystemVersion=%s.%s\n' "$f" "$machine" "$plus" "$osmaj" "$osmin" "$svmaj" "$svmin"
          }
          dump_pe build/us3d.exe
          # Ship the Mesa/llvmpipe fallback launcher next to the exe.
          cp tools/run_mesa.bat build/run_mesa.bat
      - name: Upload cross-built exe
        uses: actions/upload-artifact@v4
        with:
          name: UniverseSandbox3D-exe-cross-win64
          path: |
            build/us3d.exe
            build/run_mesa.bat
